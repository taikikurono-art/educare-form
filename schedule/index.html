<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教室スケジュール</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#fbf7f2; --paper:#fff; --ink:#3a2f2a; --muted:#8a7a70; --line:#eadfd6;
    --accent:#e8735a; --accent-soft:#fde9e2;
    --c-gym:#5aa37a; --c-gym-soft:#e3f2e9;
    --c-bb:#e06464; --c-bb-soft:#fde4e4;
    --c-yoga:#d9a441; --c-yoga-soft:#fbf1da;
    --c-dance:#5b8fc7; --c-dance-soft:#e4eef9;
    --c-studio:#e08a3c; --c-studio-soft:#fdeadb;
    --c-eng:#8c6bc8; --c-eng-soft:#eee8f8;
    --c-ksca:#3f8f8a; --c-ksca-soft:#dff1ef;
    --today:#fff3c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6;padding-inline:14px;padding-block:14px 60px}
  h1,h2,h3{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;margin:0;line-height:1.3}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  header h1{font-size:20px}
  header .sub{font-size:12px;color:var(--muted)}
  .src{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .src .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
  .src.live .dot{background:var(--c-gym)}
  .src.local .dot{background:var(--c-yoga)}

  .toolbar{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;position:sticky;top:0;z-index:5}
  .weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .weeknav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .weeknav button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .weeknav button.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .weeknav .range{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:16px;margin-inline:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted);user-select:none}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.all{font-weight:700}

  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  @media (max-width:860px){.week{grid-template-columns:1fr}}
  .day{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:80px}
  .day.today{background:var(--today);border-color:#f1d47a}
  .day.weekend .dname{color:#c75}
  .day .dname{display:flex;align-items:baseline;gap:6px;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;margin-bottom:8px}
  .day .dname .num{font-size:20px}
  .day .dname .wd{font-size:12px;color:var(--muted)}
  .day .dname .holi{font-size:11px;color:#c75;margin-left:auto}
  .day .empty{color:#c9bdb5;font-size:12px}
  .ev{border-radius:10px;padding:7px 9px;margin-bottom:6px;border-left:4px solid #999;background:#f5f5f5;font-size:12.5px}
  .ev .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ev .place{font-weight:700;font-family:"Zen Maru Gothic",sans-serif;font-size:13.5px}
  .ev .kind{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.06)}
  .ev .time{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .ev .slots{margin-top:3px;color:var(--ink);font-size:11.5px;line-height:1.5;font-variant-numeric:tabular-nums}
  .ev .slots span{white-space:nowrap;margin-right:8px}
  .ev .teacher{font-size:11px;color:var(--muted)}
  .ev .note{margin-top:3px;font-size:11px;color:#9a4a3a}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:6px;font-weight:700;margin-left:auto}
  .badge.furikae{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .badge.check{background:var(--accent);color:#fff}
  .badge.off{background:#777;color:#fff}
  .ev.off{opacity:.55;text-decoration:line-through}

  .ev.gym{border-left-color:var(--c-gym);background:var(--c-gym-soft)}
  .ev.bb{border-left-color:var(--c-bb);background:var(--c-bb-soft)}
  .ev.yoga{border-left-color:var(--c-yoga);background:var(--c-yoga-soft)}
  .ev.dance{border-left-color:var(--c-dance);background:var(--c-dance-soft)}
  .ev.studio{border-left-color:var(--c-studio);background:var(--c-studio-soft)}
  .ev.eng{border-left-color:var(--c-eng);background:var(--c-eng-soft)}
  .ev.ksca{border-left-color:var(--c-ksca);background:var(--c-ksca-soft)}

  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 0 0}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}

  .month{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
  .month h2{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .month h2 button{border:1px solid var(--line);background:#fff;border-radius:999px;width:30px;height:30px;cursor:pointer}
  .mrow{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:start}
  .mrow.today{background:var(--today)}
  .mrow .md{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:13px}
  .mrow .md small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  .mrow .mev{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:11.5px;padding:3px 8px;border-radius:999px;border-left:4px solid #999;background:#f5f5f5}
  .pill.gym{border-left-color:var(--c-gym);background:var(--c-gym-soft)}
  .pill.bb{border-left-color:var(--c-bb);background:var(--c-bb-soft)}
  .pill.yoga{border-left-color:var(--c-yoga);background:var(--c-yoga-soft)}
  .pill.dance{border-left-color:var(--c-dance);background:var(--c-dance-soft)}
  .pill.studio{border-left-color:var(--c-studio);background:var(--c-studio-soft)}
  .pill.eng{border-left-color:var(--c-eng);background:var(--c-eng-soft)}
  .pill.ksca{border-left-color:var(--c-ksca);background:var(--c-ksca-soft)}
  .pill.check{outline:2px solid var(--accent)}
  .pill.off{opacity:.5;text-decoration:line-through}

  .checklist{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:12.5px}
  .checklist h3{font-size:14px;color:var(--accent);margin-bottom:6px}
  .checklist ul{margin:0;padding-left:18px}
  .checklist li{margin-bottom:4px}
  footer{color:var(--muted);font-size:11px;margin-top:20px;text-align:center}

  .hright{display:flex;align-items:center;gap:10px}
  .linkbtn{border:none;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px}
  #app[hidden],#login[hidden]{display:none}
  .login{max-width:360px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px 20px}
  .login h1{font-size:20px;text-align:center;margin-bottom:4px}
  .login p{font-size:12px;color:var(--muted);text-align:center;margin:0 0 16px}
  .login label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .login input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:#fff;color:var(--ink)}
  .login button{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .login button:disabled{opacity:.6}
  .login .err{color:#b4533a;font-size:12.5px;margin-top:10px;text-align:center;min-height:1em}
  .ev.editable{cursor:pointer}
  .ev.editable:hover{outline:2px solid var(--accent)}
  .ev .edit-hint{font-size:10.5px;color:var(--accent);margin-top:2px}
  .modal-bg{position:fixed;inset:0;background:rgba(40,30,25,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal-bg[hidden]{display:none}
  .modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:18px 16px 26px;max-height:88vh;overflow:auto}
  @media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
  .modal h3{font-size:17px;margin-bottom:2px}
  .modal .msub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .modal .sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .modal .sec h4{margin:0 0 8px;font-size:13.5px;font-family:"Zen Maru Gothic",sans-serif}
  .modal label{font-size:12px;color:var(--muted);display:block;margin:6px 0 3px}
  .modal input{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;color:var(--ink);background:#fff}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer;color:var(--ink);margin-top:10px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .btn:disabled{opacity:.5}
  .modal .close{float:right;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
  .modal .msg{font-size:12.5px;color:#b4533a;margin-top:8px;min-height:1em}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:30}
  .toast[hidden]{display:none}
  @media print{
    body{background:#fff;padding:0}
    .toolbar{position:static;box-shadow:none}
    .week{grid-template-columns:repeat(7,1fr)}
    .chips,.legend,.checklist,footer,.weeknav button,.hright{display:none}
    .ev{break-inside:avoid}
  }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>教室スケジュール</h1>
  <p>先生・事務スタッフ用</p>
  <form id="loginForm" autocomplete="on">
    <label for="lid">ID</label>
    <input id="lid" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="lpw">パスワード</label>
    <input id="lpw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">ログイン</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>教室スケジュール</h1>
      <div class="sub" id="who">—</div>
    </div>
    <div class="hright"><div class="src" id="src"><span class="dot"></span><span id="srcText">読み込み中…</span></div><button id="logoutBtn" class="linkbtn">ログアウト</button></div>
  </header>

  <div class="toolbar">
    <div class="weeknav">
      <button id="prevW" aria-label="前の週">‹</button>
      <span class="range" id="range">—</span>
      <button id="nextW" aria-label="次の週">›</button>
      <button id="thisW">今週</button>
      <button id="nextWeekBtn" class="primary">来週</button>
      <button id="viewMonth">月の一覧</button>
      <button id="printBtn">印刷</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="weekView" class="week"></div>
  <div id="monthView" class="month" hidden></div>

  <div class="legend">
    <span style="--c:var(--c-gym)">運動・体操</span>
    <span style="--c:var(--c-bb)">バランスボール</span>
    <span style="--c:var(--c-yoga)">ベビーヨガ</span>
    <span style="--c:var(--c-dance)">ダンス</span>
    <span style="--c:var(--c-studio)">スタジオ（春日井・勝川・瀬戸）</span>
    <span style="--c:var(--c-eng)">英語</span>
    <span style="--c:var(--c-ksca)">クスカ</span>
  </div>

  <div class="checklist" id="checklist" hidden>
    <h3>要確認の予定（事務スタッフ確認用）</h3>
    <ul id="checkItems"></ul>
  </div>

  <footer id="foot">振替・休講の連絡は事務までお願いします。</footer>
</div>

<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxw3QIzqUsoYhlh7bp25SpKwWY6u5TpuwyheGiPZ7Cxi_IM_QyyZDcqwA4xiyUPN9uo/exec';
const HOLIDAYS = {'2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日','2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日','2027-02-23':'天皇誕生日','2027-03-21':'春分の日','2027-03-22':'振替休日'};
const KIND = s => /自然体験|クスカ/.test(s)?'ksca':/バランス/.test(s)?'bb':/ヨガ/.test(s)?'yoga':/ダンス/.test(s)?'dance':/英語/.test(s)?'eng':/技|アクロ|フリー/.test(s)?'studio':'gym';
const PLACE_ORDER = ['尾頭橋','ささしま','鶴舞','志賀','ココロネ','春日井','勝川','瀬戸','branch英語教室','クスカ金山','クスカ大曽根'];


let rows = [];
let role = '';
let myName = '';
let updated = '';
const TOKEN_KEY = 'educare_sched_token';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }
function setToken(t){ try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
let memToken = getToken();

async function api(action, body){
  const res = await fetch(GAS_URL + '?action=' + action, { method:'POST', body: JSON.stringify(body||{}) });
  return res.json();
}
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD = ['日','月','火','水','木','金','土'];
const mins = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60+(m||0); };
function mondayOf(d){ const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

const today = new Date(); today.setHours(0,0,0,0);
// 木曜以降は「来週」を初期表示
let weekStart = mondayOf(today);
if (today.getDay() === 0 || today.getDay() >= 4) weekStart = addDays(weekStart, 7);
let monthCursor = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1);
let mode = 'week';

// フィルタ
let selected = new Set();
try { const s = localStorage.getItem('ju_sched_places'); if (s) selected = new Set(JSON.parse(s)); } catch(e){}

function places(){ const set = new Set(rows.map(r=>r['教室'])); return PLACE_ORDER.filter(p=>set.has(p)).concat([...set].filter(p=>!PLACE_ORDER.includes(p))); }
function visible(r){ return selected.size===0 || selected.has(r['教室']); }

// 1コマ1行 → (日付・教室・種目) でまとめる
function group(list){
  const map = new Map();
  for (const r of list){
    const key = r['日付']+'|'+r['教室ID']+'|'+r['種目'];
    if (!map.has(key)) map.set(key, {date:r['日付'], place:r['教室'], kind:r['種目'], kubun:r['区分'], cid:r['教室ID'], teacher:r['担当'], slots:[], status:'通常', notes:new Set()});
    const g = map.get(key);
    g.slots.push({cls:r['クラス'], s:r['開始'], e:r['終了']});
    if (r['状態'] && r['状態']!=='通常'){ if (g.status==='通常' || r['状態']==='要確認') g.status = r['状態']; }
    if (r['備考']) g.notes.add(r['備考']);
    if (r['担当'] && !g.teacher) g.teacher = r['担当'];
  }
  const out = [...map.values()];
  out.forEach(g => g.slots.sort((a,b)=>mins(a.s)-mins(b.s)));
  out.sort((a,b)=> a.date.localeCompare(b.date) || (mins(a.slots[0].s)-mins(b.slots[0].s)) || a.place.localeCompare(b.place));
  return out;
}

function evHTML(g){
  const k = KIND(g.kind);
  const st = g.status==='要確認'?'<span class="badge check">要確認</span>':g.status==='振替'?'<span class="badge furikae">振替</span>':g.status==='休講'?'<span class="badge off">休講</span>':'';
  const slots = g.slots.map(s=>`<span>${s.s} ${s.cls}</span>`).join('');
  const range = g.slots[0].s + '〜' + g.slots.reduce((m,x)=>mins(x.e)>mins(m)?x.e:m, g.slots[0].e);
  const notes = g.notes.size? `<div class="note">${esc([...g.notes].join('／'))}</div>`:'';
  const teacher = (g.teacher && role==='staff')? `<span class="teacher">担当：${esc(g.teacher)}</span>`:'';
  const ed = role==='staff' ? ` editable" data-date="${g.date}" data-cid="${esc(g.cid)}` : '';
  return `<div class="ev ${k} ${g.status==='休講'?'off':''}${ed}">
    <div class="top"><span class="place">${g.place}</span><span class="kind">${g.kubun}・${g.kind}</span>${st}</div>
    <div class="time">${range}${teacher?'　':''}${teacher}</div>
    <div class="slots">${slots}</div>${notes}${role==='staff'?'<div class="edit-hint">タップして休講・振替</div>':''}</div>`;
}

function renderChips(){
  const el = document.getElementById('chips');
  const ps = places();
  el.innerHTML = `<span class="chip all ${selected.size===0?'on':''}" data-p="">すべて</span>` + ps.map(p=>`<span class="chip ${selected.has(p)?'on':''}" data-p="${p}">${p}</span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    const p = c.dataset.p;
    if (!p) selected.clear(); else if (selected.has(p)) selected.delete(p); else selected.add(p);
    try{ localStorage.setItem('ju_sched_places', JSON.stringify([...selected])); }catch(e){}
    renderChips(); render();
  }));
}

function renderWeek(){
  const wv = document.getElementById('weekView');
  const end = addDays(weekStart, 6);
  document.getElementById('range').textContent = `${weekStart.getMonth()+1}/${weekStart.getDate()}（月）〜 ${end.getMonth()+1}/${end.getDate()}（日）`;
  const gs = group(rows.filter(r=>visible(r) && r['日付']>=iso(weekStart) && r['日付']<=iso(end)));
  let html = '';
  for (let i=0;i<7;i++){
    const d = addDays(weekStart,i); const key = iso(d);
    const items = gs.filter(g=>g.date===key);
    const holi = HOLIDAYS[key];
    html += `<div class="day ${key===iso(today)?'today':''} ${d.getDay()===0||d.getDay()===6||holi?'weekend':''}">
      <div class="dname"><span class="num">${d.getDate()}</span><span class="wd">${d.getMonth()+1}月・${WD[d.getDay()]}曜</span>${holi?`<span class="holi">${holi}</span>`:''}</div>
      ${items.length? items.map(evHTML).join('') : '<div class="empty">予定なし</div>'}</div>`;
  }
  wv.innerHTML = html;
  const thisMon = mondayOf(today);
  document.getElementById('thisW').classList.toggle('active', iso(weekStart)===iso(thisMon));
  document.getElementById('nextWeekBtn').classList.toggle('active', iso(weekStart)===iso(addDays(thisMon,7)));
}

function renderMonth(){
  const mv = document.getElementById('monthView');
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  const first = iso(new Date(y,m,1)), last = iso(new Date(y,m+1,0));
  const gs = group(rows.filter(r=>visible(r) && r['日付']>=first && r['日付']<=last));
  const byDate = new Map(); gs.forEach(g=>{ if(!byDate.has(g.date)) byDate.set(g.date,[]); byDate.get(g.date).push(g); });
  let html = `<h2><button id="prevM">‹</button>${y}年${m+1}月<button id="nextM">›</button><span style="font-size:12px;color:var(--muted);font-weight:400">${gs.length}コマ</span></h2>`;
  if (!byDate.size) html += '<div class="empty" style="color:#c9bdb5">予定なし</div>';
  for (const [date, items] of byDate){
    const d = parse(date); const holi = HOLIDAYS[date];
    html += `<div class="mrow ${date===iso(today)?'today':''}"><div class="md">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）<small>${holi||''}</small></div><div class="mev">${items.map(g=>{
      const k = KIND(g.kind); const cls = g.status==='要確認'?'check':g.status==='休講'?'off':'';
      const t = g.slots[0].s;
      return `<span class="pill ${k} ${cls}" title="${esc([...g.notes].join('／'))}">${t} ${g.place} ${g.kind}${g.status==='振替'?'（振替）':g.status==='要確認'?'（要確認）':''}</span>`;
    }).join('')}</div></div>`;
  }
  mv.innerHTML = html;
  document.getElementById('prevM').onclick = ()=>{ monthCursor = new Date(y, m-1, 1); renderMonth(); };
  document.getElementById('nextM').onclick = ()=>{ monthCursor = new Date(y, m+1, 1); renderMonth(); };
}

function renderChecklist(){
  if (role!=='staff'){ document.getElementById('checklist').hidden = true; return; }
  const items = group(rows.filter(r=>r['状態']==='要確認'));
  const box = document.getElementById('checklist');
  if (!items.length){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('checkItems').innerHTML = items.map(g=>{
    const d = parse(g.date);
    return `<li><b>${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）${g.place} ${g.kind}</b>：${esc([...g.notes].join('／'))}</li>`;
  }).join('');
}

function render(){
  document.getElementById('weekView').hidden = mode!=='week';
  document.getElementById('monthView').hidden = mode!=='month';
  document.getElementById('viewMonth').classList.toggle('active', mode==='month');
  if (mode==='week') renderWeek(); else renderMonth();
  renderChecklist();
}

document.getElementById('prevW').onclick = ()=>{ weekStart = addDays(weekStart,-7); mode='week'; render(); };
document.getElementById('nextW').onclick = ()=>{ weekStart = addDays(weekStart,7); mode='week'; render(); };
document.getElementById('thisW').onclick = ()=>{ weekStart = mondayOf(today); mode='week'; render(); };
document.getElementById('nextWeekBtn').onclick = ()=>{ weekStart = addDays(mondayOf(today),7); mode='week'; render(); };
document.getElementById('viewMonth').onclick = ()=>{ mode = mode==='month'?'week':'month'; if (mode==='month') monthCursor = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1); render(); };
document.getElementById('printBtn').onclick = ()=>window.print();


function setSource(kind, text){ const el = document.getElementById('src'); el.className = 'src '+kind; document.getElementById('srcText').textContent = text; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2500); }

function showLogin(msg){
  document.getElementById('app').hidden = true;
  document.getElementById('login').hidden = false;
  document.getElementById('loginErr').textContent = msg||'';
}
function showApp(){
  document.getElementById('login').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('who').textContent = role==='staff' ? `${myName}（全教室・休講/振替の登録ができます）` : `${myName}の担当クラス`;
  document.getElementById('foot').textContent = role==='staff'
    ? '予定をタップすると休講・振替を登録できます。変更は体験フォーム・カレンダーにも反映されます。'
    : '振替・休講の連絡は事務までお願いします。';
}

async function load(){
  setSource('', '読み込み中…');
  try{
    const j = await api('schedData', {token: memToken});
    if (!j.ok){ setToken(''); memToken=''; showLogin(j.error==='auth'?'もう一度ログインしてください':''); return; }
    rows = j.rows||[]; role = j.role; myName = j.name; updated = j.updated||'';
    showApp(); renderChips(); render();
    setSource('live', '最新（'+updated+'）');
  }catch(e){
    if (!rows.length) showApp();
    setSource('local', '通信できませんでした。電波の良い所で再読み込みしてください');
  }
}

document.getElementById('loginForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='確認中…';
  document.getElementById('loginErr').textContent='';
  try{
    const j = await api('schedLogin', {id:document.getElementById('lid').value.trim(), pass:document.getElementById('lpw').value});
    if (j.ok){ memToken=j.token; setToken(j.token); document.getElementById('lpw').value=''; await load(); }
    else document.getElementById('loginErr').textContent = j.error==='locked' ? '何度も間違えたため10分間ログインできません' : 'IDかパスワードが違います';
  }catch(e){ document.getElementById('loginErr').textContent='通信できませんでした'; }
  btn.disabled=false; btn.textContent='ログイン';
});
document.getElementById('logoutBtn').onclick = ()=>{ setToken(''); memToken=''; rows=[]; showLogin(''); };

// ---- 事務：休講・振替 ----
const modalBg = document.getElementById('modalBg'), modal = document.getElementById('modal');
function closeModal(){ modalBg.hidden = true; }
modalBg.addEventListener('click', e=>{ if (e.target===modalBg) closeModal(); });

function openEdit(date, cid){
  const g = group(rows.filter(r=>r['日付']===date && r['教室ID']===cid))[0];
  if (!g) return;
  const d = parse(date);
  const label = `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  const note = [...g.notes].join('／');
  let body = `<button class="close" aria-label="閉じる">×</button>
    <h3>${label} ${esc(g.place)}</h3>
    <div class="msub">${esc(g.kubun)}・${esc(g.kind)}　${g.slots.map(s=>esc(s.s+' '+s.cls)).join('、')}${g.status!=='通常'?'　<b>['+esc(g.status)+']</b>':''}</div>`;
  if (g.status==='振替'){
    body += `<div class="sec"><h4>この振替を取り消す</h4>
      <div style="font-size:12.5px">${esc(note)}</div>
      <button class="btn dark" id="bRemove">振替を取り消す</button>
      <div style="font-size:11.5px;color:var(--muted);margin-top:6px">元の日の「休講」は自動では戻りません。必要なら元の日を開いて「通常に戻す」を押してください。</div></div>`;
  } else {
    body += `<div class="sec"><h4>${g.status==='休講'?'休講を取り消す':'休講にする'}</h4>
      <label>理由・メモ（先生と事務に表示されます）</label>
      <input id="iNote" value="${esc(g.status==='休講'?note:'')}" placeholder="例：園行事のため">
      ${g.status==='休講'
        ? `<button class="btn" id="bSaveNote">メモだけ保存</button> <button class="btn dark" id="bNormal">通常に戻す</button>`
        : `<button class="btn dark" id="bOff">休講にする</button>`}
    </div>
    <div class="sec"><h4>振替日を登録する</h4>
      <div class="row2"><div><label>振替日</label><input id="iTo" type="date"></div>
      <div><label>開始時刻（変える場合のみ）</label><input id="iStart" type="time" placeholder="${esc(g.slots[0].s)}"></div></div>
      <label>メモ（任意）</label><input id="iMNote" placeholder="例：園の都合で変更">
      <button class="btn primary" id="bMakeup">振替を登録（この日は休講になります）</button>
    </div>`;
  }
  body += `<div class="msg" id="mMsg"></div>`;
  modal.innerHTML = body; modalBg.hidden = false;
  modal.querySelector('.close').onclick = closeModal;
  const run = async (btn, action, payload, done)=>{
    modal.querySelectorAll('button.btn').forEach(b=>b.disabled=true);
    document.getElementById('mMsg').textContent='保存中…';
    try{
      const j = await api(action, Object.assign({token:memToken}, payload));
      if (j.ok){ closeModal(); toast(done); await load(); }
      else { document.getElementById('mMsg').textContent = j.error==='auth'?'ログインし直してください':'保存できませんでした（'+(j.error||'')+'）'; modal.querySelectorAll('button.btn').forEach(b=>b.disabled=false); }
    }catch(e){ document.getElementById('mMsg').textContent='通信できませんでした'; modal.querySelectorAll('button.btn').forEach(b=>b.disabled=false); }
  };
  const $ = id=>document.getElementById(id);
  if ($('bOff')) $('bOff').onclick = ()=>run($('bOff'),'schedSetStatus',{date, classroomId:cid, status:'休講', note:$('iNote').value.trim()}, '休講にしました');
  if ($('bNormal')) $('bNormal').onclick = ()=>run($('bNormal'),'schedSetStatus',{date, classroomId:cid, status:'通常', note:''}, '通常に戻しました');
  if ($('bSaveNote')) $('bSaveNote').onclick = ()=>run($('bSaveNote'),'schedSetStatus',{date, classroomId:cid, status:'休講', note:$('iNote').value.trim()}, 'メモを保存しました');
  if ($('bRemove')) $('bRemove').onclick = ()=>run($('bRemove'),'schedRemoveMakeup',{date, classroomId:cid}, '振替を取り消しました');
  if ($('bMakeup')) $('bMakeup').onclick = ()=>{
    const to = $('iTo').value;
    if (!to){ $('mMsg').textContent='振替日を選んでください'; return; }
    if (to===date){ $('mMsg').textContent='元の日と同じ日です'; return; }
    run($('bMakeup'),'schedAddMakeup',{fromDate:date, classroomId:cid, toDate:to, newStart:$('iStart').value, note:$('iMNote').value.trim()}, '振替を登録しました');
  };
}
document.getElementById('weekView').addEventListener('click', e=>{
  const ev = e.target.closest('.ev.editable'); if (!ev) return;
  openEdit(ev.dataset.date, ev.dataset.cid);
});

// 起動
if (memToken) load(); else showLogin('');

</script>
</body>
</html>
